<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부산 데이트 후보 ✨</title>
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="style.css">
    <!-- 아이콘: Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="app-container">
        <!-- 헤더 섹션 -->
        <header class="header">
            <div class="header-titles">
                <h1>부산 데이트 후보 ✨</h1>
                <p class="subtitle">토요일 저녁의 감성 플레이스 😏</p>
            </div>
            
            <!-- 통합 검색창 -->
            <div class="search-bar">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="searchInput" placeholder="어떤 느낌을 원해? (예: 요트, 방탈출)">
            </div>
        </header>

        <main class="main-content">
            <!-- 필터 섹션 (스크롤 가능) -->
            <div class="filters-container">
                <div class="filter-group">
                    <span class="filter-label">지역</span>
                    <div class="chip-slider" id="regionFilters">
                        <button class="chip active" data-filter="all">전체</button>
                        <button class="chip" data-filter="광안리">광안리</button>
                        <button class="chip" data-filter="해운대">해운대</button>
                        <button class="chip" data-filter="서면">서면</button>
                        <button class="chip" data-filter="기타">기타</button>
                    </div>
                </div>

                <div class="filter-group">
                    <span class="filter-label">카테고리</span>
                    <div class="chip-slider" id="categoryFilters">
                        <button class="chip active" data-filter="all">전체</button>
                        <button class="chip" data-filter="액티비티">액티비티 🏃</button>
                        <button class="chip" data-filter="야경">야경 🌃</button>
                        <button class="chip" data-filter="실내">실내/전시 🎨</button>
                        <button class="chip" data-filter="이색체험">이색체험 🧩</button>
                    </div>
                </div>
            </div>

            <!-- 정렬 & 토글 옵션 -->
            <div class="actions-bar">
                <div class="sort-dropdown">
                    <select id="sortSelect">
                        <option value="recommend">추천도 높은순 ⭐</option>
                        <option value="price_asc">가격 낮은순 💸</option>
                        <option value="time_asc">소요시간 짧은순 ⏱</option>
                    </select>
                </div>
                <!-- 야간 데이트 토글 버튼 -->
                <button class="toggle-btn" id="nightToggle" aria-pressed="false">
                    <span class="material-symbols-outlined">dark_mode</span>
                    야간 데이트 전용
                </button>
            </div>

            <hr class="divider">

            <!-- 스마트 추천 섹션 -->
            <section class="section" id="topPicksSection">
                <h2 class="section-title">⚡ 고민된다면 이거! (Top 2)</h2>
                <div class="horizontal-list" id="topPicksContainer">
                    <!-- JS 랜더링 영역 -->
                </div>
            </section>

            <!-- 전체 리스트 섹션 -->
            <section class="section">
                <h2 class="section-title">이 중에서 골라줘! <span id="resultCount">0</span>곳</h2>
                <div class="card-list" id="mainContainer">
                    <!-- JS 랜더링 영역 -->
                </div>
            </section>
        </main>

        <!-- 하단 네비게이션 -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <span class="material-symbols-outlined">attractions</span>
                <span>놀거리</span>
            </a>
            <a href="food.html" class="nav-item">
                <span class="material-symbols-outlined">restaurant</span>
                <span>맛집</span>
            </a>
        </nav>
    </div>

    <!-- 페이지 타입 변수 설정 후 공통 스크립트 실행 -->
    <script>
        window.APP_PAGE_TYPE = 'place';
    </script>
    <script src="script.js"></script>
</body>
</html>
