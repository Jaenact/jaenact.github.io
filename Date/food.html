<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘 뭐 먹지? 🍽</title>
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="style.css">
    <!-- 아이콘: Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="app-container">
        <!-- 헤더 섹션 -->
        <header class="header">
            <div class="header-titles">
                <h1>분위기 맛집 리스트 🍽</h1>
                <p class="subtitle">실패 없는 저녁 데이트 필수 코스</p>
            </div>
            
            <!-- 통합 검색창 -->
            <div class="search-bar">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="searchInput" placeholder="먹고 싶은 메뉴? (예: 파스타, 곱창)">
            </div>
        </header>

        <main class="main-content">
            <!-- 필터 섹션 -->
            <div class="filters-container">
                <div class="filter-group">
                    <span class="filter-label">지역</span>
                    <div class="chip-slider" id="regionFilters">
                        <button class="chip active" data-filter="all">전체</button>
                        <button class="chip" data-filter="광안리">광안리</button>
                        <button class="chip" data-filter="해운대">해운대</button>
                        <button class="chip" data-filter="서면">서면</button>
                        <button class="chip" data-filter="기타">기타</button>
                    </div>
                </div>

                <div class="filter-group">
                    <span class="filter-label">분류</span>
                    <div class="chip-slider" id="categoryFilters">
                        <button class="chip active" data-filter="all">전체</button>
                        <button class="chip" data-filter="레스토랑">레스토랑 🍷</button>
                        <button class="chip" data-filter="고기">고기 🥩</button>
                        <button class="chip" data-filter="노포/로컬">노포/로컬 🍺</button>
                        <button class="chip" data-filter="디저트">디저트 🍰</button>
                    </div>
                </div>
            </div>

            <!-- 정렬 & 토글 옵션 -->
            <div class="actions-bar">
                <div class="sort-dropdown">
                    <select id="sortSelect">
                        <option value="recommend">추천도 높은순 ⭐</option>
                        <option value="price_asc">가격 낮은순 💸</option>
                        <option value="time_asc">웨이팅 짧은순 ⏱</option>
                    </select>
                </div>
                <button class="toggle-btn" id="nightToggle" aria-pressed="false">
                    <span class="material-symbols-outlined">liquor</span>
                    심야 식당/술집
                </button>
            </div>

            <hr class="divider">

            <section class="section" id="topPicksSection">
                <h2 class="section-title">⚡ 빠른 선택 (결정장애 방지)</h2>
                <div class="horizontal-list" id="topPicksContainer">
                    <!-- JS 렌더링 영역 -->
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">맛집 리스트 <span id="resultCount">0</span>곳</h2>
                <div class="card-list" id="mainContainer">
                    <!-- JS 렌더링 영역 -->
                </div>
            </section>
        </main>

        <!-- 하단 네비게이션 -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <span class="material-symbols-outlined">attractions</span>
                <span>놀거리</span>
            </a>
            <a href="food.html" class="nav-item active">
                <span class="material-symbols-outlined">restaurant</span>
                <span>맛집</span>
            </a>
        </nav>
    </div>

    <!-- 페이지 타입 변수 설정 -->
    <script>
        window.APP_PAGE_TYPE = 'food';
    </script>
    <script src="script.js"></script>
</body>
</html>
